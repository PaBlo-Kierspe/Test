name: iOS-App bauen

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Version
        run: xcodebuild -version

      - name: Für den Simulator bauen (Prüfung)
        run: |
          xcodebuild -project ios/Kassenbuch.xcodeproj -scheme Kassenbuch \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60
          exit ${PIPESTATUS[0]}

      - name: Für das iPhone bauen (unsigniert)
        run: |
          xcodebuild -project ios/Kassenbuch.xcodeproj -scheme Kassenbuch \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 20
          exit ${PIPESTATUS[0]}

      - name: IPA packen
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Kassenbuch.app Payload/
          zip -qry Kassenbuch-unsigniert.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Kassenbuch-unsigniert-ipa
          path: Kassenbuch-unsigniert.ipa
