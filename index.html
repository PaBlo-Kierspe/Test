<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kassenbuch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kassenbuch">
<meta name="theme-color" content="#f2f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0e13" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* Layout: iOS-style single column, sticky month header, cards, fixed bottom tab bar + floating add button */
:root {
  --bg: #f2f4f8;
  --card: #ffffff;
  --fg: #111521;
  --muted: #5b6273;
  --faint: #8a90a0;
  --line: #e2e5ec;
  --chip: #eceff5;
  --ink: #111521;
  --ink-fg: #ffffff;
  --inc: #1baf7a;
  --exp: #eb6834;
  --sav: #2a78d6;
  --neg: #c8372f;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
  --font-d: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0e13; --card: #171a22; --fg: #eef0f5; --muted: #a1a8b8; --faint: #747b8c;
    --line: #272b36; --chip: #222631; --ink: #eef0f5; --ink-fg: #0c0e13;
    --inc: #199e70; --exp: #d95926; --sav: #3987e5; --neg: #ef6b63;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #0ca30c; --c7: #9085e9; --c8: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0e13; --card: #171a22; --fg: #eef0f5; --muted: #a1a8b8; --faint: #747b8c;
  --line: #272b36; --chip: #222631; --ink: #eef0f5; --ink-fg: #0c0e13;
  --inc: #199e70; --exp: #d95926; --sav: #3987e5; --neg: #ef6b63;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
  --c5: #d55181; --c6: #0ca30c; --c7: #9085e9; --c8: #e66767;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.4 var(--font);
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(110px + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sav); outline-offset: 2px; }
.wrap { max-width: 640px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* header */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-block: 10px 8px; display: flex; flex-direction: column; gap: 8px;
}
.titlerow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font: 700 30px/1.1 var(--font-d); letter-spacing: -0.02em; margin: 0; }
.monthnav { display: flex; align-items: center; gap: 4px; background: var(--card); border-radius: 999px; padding: 3px; }
.monthnav button { border: 0; background: transparent; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; color: var(--muted); }
.monthnav button:active { background: var(--chip); }
.monthnav span { font-weight: 600; font-size: 14px; min-width: 112px; text-align: center; }

.card { background: var(--card); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { font: 600 13px/1.2 var(--font); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; }
.card .sub { color: var(--muted); font-size: 13px; margin: 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

/* hero */
.hero { background: var(--ink); color: var(--ink-fg); }
.hero h2 { color: inherit; opacity: .7; }
.hero .big { font: 700 40px/1 var(--font-d); letter-spacing: -0.03em; }
.hero .meta { font-size: 13px; opacity: .75; }
.flow { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; background: color-mix(in srgb, var(--ink-fg) 18%, transparent); }
.flow i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 3px; flex: none; display: inline-block; }

.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--card); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; border: 0; text-align: left; }
.tile .lbl { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tile .val { font: 700 17px/1.15 var(--font-d); letter-spacing: -0.01em; overflow-wrap: anywhere; }
.tile .delta { font-size: 11px; color: var(--faint); }

/* charts */
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--muted); font: 11px var(--font); }
.donutwrap { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 14px; align-items: center; }
.catlist { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.catlist .ci { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13.5px; }
.catlist .ci > span { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.catlist .ci > span > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.catlist .ci small { color: var(--faint); font-size: 11.5px; }
.catlist .ci b { font-weight: 600; }
.hbar { display: flex; flex-direction: column; gap: 10px; }
.hb { display: flex; flex-direction: column; gap: 5px; }
.hb .track { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; }
.hb .track i { display: block; height: 100%; border-radius: 4px; }
.info { font-size: 13px; color: var(--muted); min-height: 1.4em; }
.info b { color: var(--fg); font-weight: 600; }

/* list */
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 0; background: var(--card); padding: 7px 13px; border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--ink-fg); }
.day { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; padding: 4px 4px 0; }
.list { background: var(--card); border-radius: var(--r); overflow: hidden; }
.item { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 14px; border: 0; background: transparent; width: 100%; text-align: left; }
.item + .item { border-top: 1px solid var(--line); }
.item:active { background: var(--chip); }
.ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; }
.item .t { font-weight: 600; font-size: 15px; display: flex; gap: 6px; align-items: center; min-width: 0; }
.item .n { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .m { font-weight: 600; font-size: 15px; white-space: nowrap; }
.pos { color: var(--inc); }
.tag { font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 6px; border-radius: 6px; background: var(--chip); color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 34px 16px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.empty b { color: var(--fg); font-size: 16px; }

/* table */
.tablewrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 13px; }
th, td { padding: 9px 6px; text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line); }
tbody td { border-bottom: 1px solid var(--line); }
tfoot td { font-weight: 700; }
td.neg { color: var(--neg); }
th .dot { margin-right: 4px; }

/* progress ring */
.goal { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 16px; align-items: center; }

/* settings */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .lab { font-size: 13px; color: var(--muted); font-weight: 500; }
.input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 11px 12px; font-size: 16px; }
.input { -webkit-appearance: none; appearance: none; min-width: 0; margin: 0; min-height: 46px; color: var(--fg); }
input[type=date].input { display: block; text-align: left; }
input[type=date]::-webkit-date-and-time-value { text-align: left; }
.btn { border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 600; font-size: 16px; background: var(--chip); color: var(--fg); }
.btn.primary { background: var(--ink); color: var(--ink-fg); }
.btn.danger { color: var(--neg); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow .btn { flex: 1 1 140px; }
.banner { background: color-mix(in srgb, var(--c4) 18%, var(--card)); border-radius: var(--r); padding: 12px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: 14px; }
.banner button { border: 0; background: var(--ink); color: var(--ink-fg); border-radius: 999px; padding: 7px 12px; font-weight: 600; font-size: 13px; white-space: nowrap; }

/* tab bar */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter: saturate(1.6) blur(18px); -webkit-backdrop-filter: saturate(1.6) blur(18px);
  border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  display: flex; justify-content: space-around;
}
nav.tabs button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 500; color: var(--faint); padding: 4px 6px; min-width: 56px; }
nav.tabs button svg { width: 25px; height: 25px; }
nav.tabs button svg * { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current="page"] { color: var(--fg); }
.fab {
  position: fixed; z-index: 21; right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px));
  bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--ink); color: var(--ink-fg);
  font-size: 32px; line-height: 1; box-shadow: 0 8px 24px rgb(0 0 0 / .22);
}

/* sheet */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .38); z-index: 40; opacity: 0; transition: opacity .2s; }
.scrim.on { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--card);
  border-radius: 22px 22px 0 0; max-height: 92%; overflow-y: auto; transform: translateY(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1);
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
}
.sheet.on { transform: none; }
.sheet form { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 4px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--chip); border-radius: 12px; padding: 3px; gap: 3px; }
.seg label { text-align: center; padding: 8px 4px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg input:checked + label { background: var(--card); color: var(--fg); box-shadow: 0 1px 4px rgb(0 0 0 / .12); }
.seg input:focus-visible + label { outline: 2px solid var(--sav); }
.amount { position: relative; display: block; }
.amount input {
  -webkit-appearance: none; appearance: none; display: block; width: 100%; min-width: 0; margin: 0;
  border: 2px solid var(--line); border-radius: 16px; background: var(--bg); color: var(--fg);
  padding: 12px 52px; height: 72px; font: 700 36px/1 var(--font-d); text-align: center; letter-spacing: -0.01em;
}
.amount input::placeholder { color: var(--faint); opacity: 1; }
.amount input:focus { outline: none; border-color: var(--sav); }
.amount span { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font: 600 24px/1 var(--font-d); color: var(--muted); pointer-events: none; }
.cats { display: flex; flex-wrap: wrap; gap: 7px; }
.cats input { position: absolute; opacity: 0; pointer-events: none; }
.cats label { padding: 8px 12px; border-radius: 999px; background: var(--chip); font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.cats input:checked + label { background: var(--ink); color: var(--ink-fg); }
.cats input:focus-visible + label { outline: 2px solid var(--sav); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--sav); }
.confirm { display: flex; flex-direction: column; gap: 10px; background: var(--chip); border-radius: 14px; padding: 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%) translateY(20px); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--ink-fg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; transition: .2s; z-index: 60; pointer-events: none; white-space: nowrap; }
.toast.on { opacity: 1; transform: translateX(-50%); }
@media (max-width: 380px) {
  .tiles { gap: 6px; } .tile { padding: 10px; } .tile .val { font-size: 15px; }
  .donutwrap { grid-template-columns: 96px minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .sheet, .scrim, .toast { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="titlerow">
      <h1 id="title">Übersicht</h1>
      <div class="monthnav" id="monthnav">
        <button id="prev" aria-label="Vorheriger Zeitraum">‹</button>
        <span id="period">–</span>
        <button id="next" aria-label="Nächster Zeitraum">›</button>
      </div>
    </div>
  </header>
  <main id="main" class="wrap"></main>
</div>

<button class="fab" id="fab" aria-label="Buchung hinzufügen">+</button>

<nav class="tabs" id="tabs">
  <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Übersicht</button>
  <button data-tab="list"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Buchungen</button>
  <button data-tab="year"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M9 9v12M15 9v12"/></svg>Jahr</button>
  <button data-tab="save"><svg viewBox="0 0 24 24"><path d="M5 11a7 6 0 0 1 13-2h2v4l-2 1v3h-3v-2h-5v2H7v-3a6 6 0 0 1-2-3z"/><path d="M15 10h.01"/></svg>Sparen</button>
  <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Mehr</button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheettitle" hidden>
  <form id="form" autocomplete="off">
    <div class="grab"></div>
    <div class="row"><strong id="sheettitle" style="font-size:17px">Neue Buchung</strong><button type="button" class="chip" id="cancel">Abbrechen</button></div>
    <div class="seg" role="radiogroup" aria-label="Art">
      <input type="radio" name="type" id="t-income" value="income"><label for="t-income">Einnahme</label>
      <input type="radio" name="type" id="t-expense" value="expense" checked><label for="t-expense">Ausgabe</label>
      <input type="radio" name="type" id="t-saving" value="saving"><label for="t-saving">Sparen</label>
    </div>
    <div class="amount"><input id="amount" type="text" inputmode="decimal" enterkeyhint="done" placeholder="0,00" aria-label="Betrag in Euro" maxlength="14" required><span>€</span></div>
    <div class="field"><span class="lab">Kategorie</span><div class="cats" id="cats"></div></div>
    <div class="two">
      <div class="field"><label for="date">Datum</label><input class="input" type="date" id="date" required></div>
      <div class="field"><label for="note">Notiz</label><input class="input" id="note" placeholder="optional" maxlength="60"></div>
    </div>
    <label class="toggle" for="recurring"><span>Jeden Monat wiederholen<br><small style="color:var(--muted)">z. B. Miete, Gehalt, Sparplan</small></span><input type="checkbox" id="recurring"></label>
    <p id="formerr" class="sub" style="color:var(--neg)" hidden></p>
    <button class="btn primary" type="submit" id="save">Speichern</button>
    <button class="btn danger" type="button" id="del" hidden>Buchung löschen</button>
  </form>
</div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importfile" accept="application/json,.json" hidden>

<script>
(() => {
'use strict';
const KEY = 'kassenbuch.v1';
const CATS = {
  income: [
    { id: 'gehalt', name: 'Gehalt', s: 'G' },
    { id: 'zinsen', name: 'Zinsen', s: 'Z', passive: true },
    { id: 'miete_ein', name: 'Mieteinnahmen', s: 'M', passive: true },
    { id: 'dividende', name: 'Dividenden', s: 'D', passive: true },
    { id: 'nebenjob', name: 'Nebenjob', s: 'N' },
    { id: 'sonst_ein', name: 'Sonstiges', s: '+' }
  ],
  expense: [
    { id: 'wohnen', name: 'Wohnen', s: 'W' },
    { id: 'lebensmittel', name: 'Lebensmittel', s: 'L' },
    { id: 'mobil', name: 'Mobilität', s: 'M' },
    { id: 'versich', name: 'Versicherungen', s: 'V' },
    { id: 'freizeit', name: 'Freizeit', s: 'F' },
    { id: 'gesund', name: 'Gesundheit', s: 'G' },
    { id: 'abos', name: 'Abos & Verträge', s: 'A' },
    { id: 'sonst_aus', name: 'Sonstiges', s: '·' }
  ],
  saving: [
    { id: 'tagesgeld', name: 'Tagesgeld', s: 'T' },
    { id: 'etf', name: 'ETF / Depot', s: 'E' },
    { id: 'notgroschen', name: 'Notgroschen', s: 'N' },
    { id: 'rente', name: 'Altersvorsorge', s: 'R' },
    { id: 'sonst_spar', name: 'Sonstiges', s: '·' }
  ]
};
const TYPE = {
  income: { name: 'Einnahmen', one: 'Einnahme', color: 'var(--inc)' },
  expense: { name: 'Ausgaben', one: 'Ausgabe', color: 'var(--exp)' },
  saving: { name: 'Ersparnisse', one: 'Sparen', color: 'var(--sav)' }
};
const SERIES = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)','var(--c8)'];
const PASSIVE = ['zinsen', 'miete_ein', 'dividende'];
const catOf = (type, id) => (CATS[type] || []).find(c => c.id === id) || { id, name: id, s: '?' };
const catColor = (type, id) => {
  if (type === 'income') return { zinsen: 'var(--c1)', miete_ein: 'var(--c4)', dividende: 'var(--c7)' }[id] || 'var(--inc)';
  if (type === 'saving') return 'var(--sav)';
  const i = CATS.expense.findIndex(c => c.id === id);
  return SERIES[i < 0 ? 7 : i];
};

/* ---------- formatting & dates ---------- */
const eur = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
const eur0 = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const fmt = v => eur.format(v);
const fmtK = v => Math.abs(v) >= 10000 ? (v / 1000).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' T€' : eur0.format(v);
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const ymNow = () => today().slice(0, 7);
const addM = (ym, n) => { let [y, m] = ym.split('-').map(Number); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return `${y}-${pad(m)}`; };
const mLong = ym => new Date(ym + '-15').toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
const mShort = ym => new Date(ym + '-15').toLocaleDateString('de-DE', { month: 'short' }).replace('.', '');
const dayLabel = ds => {
  if (ds === today()) return 'Heute';
  return new Date(ds + 'T12:00').toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const lastDay = ym => new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate();

/* ---------- storage ---------- */
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return null;
}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
let S = load();
if (!S || !Array.isArray(S.entries)) { S = demoData(); }
S.settings = Object.assign({ goal: 15000, startSavings: 0 }, S.settings || {});
S.rules = S.rules || [];

/* Recurring rules: create the missing monthly entries up to the current month */
function materialize() {
  const now = ymNow();
  for (const r of S.rules) {
    while (r.next <= now) {
      const d = Math.min(r.day, lastDay(r.next));
      S.entries.push({ id: uid(), type: r.type, amount: r.amount, cat: r.cat, note: r.note, date: `${r.next}-${pad(d)}`, rule: r.id });
      r.next = addM(r.next, 1);
    }
  }
}

function demoData() {
  const st = { demo: true, entries: [], rules: [], settings: { goal: 15000, startSavings: 4200 } };
  const now = ymNow();
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const add = (ym, day, type, amount, cat, note) => st.entries.push({ id: uid(), type, amount: Math.round(amount * 100) / 100, cat, note, date: `${ym}-${pad(Math.min(day, lastDay(ym)))}` });
  for (let i = 5; i >= 0; i--) {
    const ym = addM(now, -i);
    const curDay = i === 0 ? +today().slice(8) : 31;
    const lim = (d) => d <= curDay;
    if (lim(1)) { add(ym, 1, 'income', 3240, 'gehalt', 'Nettogehalt'); add(ym, 1, 'expense', 1080, 'wohnen', 'Warmmiete'); }
    if (lim(3)) add(ym, 3, 'income', 640, 'miete_ein', 'Wohnung Lindenstraße');
    if (lim(2)) { add(ym, 2, 'saving', 400, 'etf', 'Sparplan MSCI World'); add(ym, 2, 'saving', 150, 'tagesgeld', 'Dauerauftrag'); }
    if (lim(28)) add(ym, 28, 'income', 38 + rnd() * 6, 'zinsen', 'Tagesgeld 2,6 %');
    if ([2, 5].includes((+ym.slice(5)) % 6) && lim(15)) add(ym, 15, 'income', 120 + rnd() * 140, 'dividende', 'Quartalsausschüttung');
    if (lim(5)) add(ym, 5, 'expense', 96.5, 'versich', 'Haftpflicht & Hausrat');
    if (lim(6)) add(ym, 6, 'expense', 32.97, 'abos', 'Handy, Streaming');
    for (let w = 0; w < 4; w++) { const d = 4 + w * 7; if (lim(d)) add(ym, d, 'expense', 70 + rnd() * 55, 'lebensmittel', ['Wocheneinkauf', 'Markt', 'Supermarkt', 'Drogerie & Einkauf'][w]); }
    if (lim(10)) add(ym, 10, 'expense', 49, 'mobil', 'Deutschlandticket');
    if (lim(18)) add(ym, 18, 'expense', 55 + rnd() * 90, 'mobil', 'Tanken');
    if (lim(13)) add(ym, 13, 'expense', 40 + rnd() * 120, 'freizeit', ['Kino & Essen', 'Konzert', 'Restaurant', 'Ausflug'][Math.floor(rnd() * 4)]);
    if (lim(22) && rnd() > .5) add(ym, 22, 'expense', 20 + rnd() * 60, 'gesund', 'Apotheke');
    if (lim(24)) add(ym, 24, 'expense', 25 + rnd() * 70, 'sonst_aus', 'Geschenk');
    if (i === 3 && lim(20)) add(ym, 20, 'income', 380, 'nebenjob', 'Nachhilfe');
  }
  return st;
}

/* ---------- aggregates ---------- */
function inMonth(ym) { return S.entries.filter(e => e.date.startsWith(ym)); }
function sums(list) {
  const t = { income: 0, expense: 0, saving: 0, passive: 0, byCat: {} };
  for (const e of list) {
    t[e.type] += e.amount;
    if (e.type === 'income' && PASSIVE.includes(e.cat)) t.passive += e.amount;
    const k = e.type + ':' + e.cat; t.byCat[k] = (t.byCat[k] || 0) + e.amount;
  }
  t.free = t.income - t.expense - t.saving;
  return t;
}
const savingsUntil = ym => S.settings.startSavings + S.entries.filter(e => e.type === 'saving' && e.date.slice(0, 7) <= ym).reduce((a, e) => a + e.amount, 0);

/* ---------- UI state ---------- */
const U = { tab: 'home', ym: ymNow(), year: +ymNow().slice(0, 4), filter: 'all', sel: null };
try { const t = localStorage.getItem(KEY + '.tab'); if (t) U.tab = t; } catch (e) {}
const $ = id => document.getElementById(id);
const main = $('main');

/* ---------- charts ---------- */
function donut(items, total, label) {
  const R = 52, C = 2 * Math.PI * R; let off = 0;
  const gap = items.length > 1 ? 2.5 : 0;
  const segs = items.map(it => {
    const len = total ? it.v / total * C : 0;
    const s = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${it.c}" stroke-width="18" stroke-dasharray="${Math.max(len - gap, 0.01)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(it.n)}: ${fmt(it.v)}</title></circle>`;
    off += len; return s;
  }).join('');
  return `<svg viewBox="0 0 140 140" role="img" aria-label="${esc(label)}">
    <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--chip)" stroke-width="18"/>${segs}
    <text x="70" y="66" text-anchor="middle" style="font-size:11px">${esc(label)}</text>
    <text x="70" y="84" text-anchor="middle" style="font:700 15px var(--font-d);fill:var(--fg)">${fmtK(total)}</text></svg>`;
}
function niceMax(v) { if (v <= 0) return 400; const st = v / 4, p = Math.pow(10, Math.floor(Math.log10(st))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= st) return m * p * 4; return 40 * p; }
function barPath(x, y, w, h, r) { if (h <= 0) return ''; r = Math.min(r, h, w / 2); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }

function monthBars(months) {
  const W = 340, H = 170, L = 40, B = 22, T = 8;
  const data = months.map(ym => ({ ym, ...sums(inMonth(ym)) }));
  const max = niceMax(Math.max(...data.map(d => Math.max(d.income, d.expense, d.saving))));
  const ih = H - B - T, gw = (W - L) / data.length, bw = Math.min(12, (gw - 14) / 3);
  const y = v => T + ih - v / max * ih;
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = max * i / 4, yy = y(v); g += `<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${fmtK(v)}</text>`; }
  data.forEach((d, i) => {
    const gx = L + i * gw, x0 = gx + (gw - (bw * 3 + 4)) / 2;
    const sel = d.ym === U.ym;
    if (sel) g += `<rect x="${gx + 2}" y="${T - 4}" width="${gw - 4}" height="${ih + 4}" rx="8" fill="var(--chip)"/>`;
    ['income', 'expense', 'saving'].forEach((k, j) => { const h = d[k] / max * ih; g += `<path d="${barPath(x0 + j * (bw + 2), y(d[k]), bw, h, 3)}" fill="${TYPE[k].color}"/>`; });
    g += `<text x="${gx + gw / 2}" y="${H - 6}" text-anchor="middle" style="${sel ? 'fill:var(--fg);font-weight:600' : ''}">${mShort(d.ym)}</text>`;
    g += `<rect x="${gx}" y="0" width="${gw}" height="${H}" fill="transparent" data-ym="${d.ym}" style="cursor:pointer"><title>${mLong(d.ym)}</title></rect>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Einnahmen, Ausgaben und Ersparnisse der letzten 6 Monate" id="bars">${g}</svg>`;
}

function savingsLine(months) {
  const W = 340, H = 150, L = 44, B = 22, T = 14;
  const pts = months.map(ym => ({ ym, v: savingsUntil(ym) }));
  const max = niceMax(Math.max(...pts.map(p => p.v), 1));
  const ih = H - B - T, step = (W - L - 10) / (pts.length - 1 || 1);
  const X = i => L + 4 + i * step, Y = v => T + ih - v / max * ih;
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = max * i / 4, yy = Y(v); g += `<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${fmtK(v)}</text>`; }
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  g += `<path d="${line}L${X(pts.length - 1)},${T + ih}L${X(0)},${T + ih}Z" fill="var(--sav)" opacity=".13"/>`;
  g += `<path d="${line}" fill="none" stroke="var(--sav)" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => { if (i % 2 === (pts.length - 1) % 2) g += `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${mShort(p.ym)}</text>`; });
  const last = pts[pts.length - 1];
  g += `<circle cx="${X(pts.length - 1)}" cy="${Y(last.v)}" r="5" fill="var(--sav)" stroke="var(--card)" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entwicklung des Sparguthabens">${g}</svg>`;
}

function ring(p) {
  const R = 44, C = 2 * Math.PI * R, v = Math.max(0, Math.min(1, p));
  return `<svg viewBox="0 0 110 110" role="img" aria-label="Sparziel zu ${Math.round(p * 100)} % erreicht">
    <circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--chip)" stroke-width="12"/>
    <circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--sav)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${v * C} ${C}" transform="rotate(-90 55 55)"/>
    <text x="55" y="61" text-anchor="middle" style="font:700 19px var(--font-d);fill:var(--fg)">${Math.round(p * 100)} %</text></svg>`;
}

/* ---------- views ---------- */
function banner() {
  return S.demo ? `<div class="banner"><span>Du siehst <b>Beispieldaten</b>, damit du die App kennenlernst.</span><button data-act="cleardemo">Leeren &amp; starten</button></div>` : '';
}

function viewHome() {
  const t = sums(inMonth(U.ym));
  const prev = sums(inMonth(addM(U.ym, -1)));
  const quote = t.income ? t.saving / t.income : 0;
  const base = Math.max(t.income, t.expense + t.saving) || 1;
  const pct = v => (Math.max(v, 0) / base * 100).toFixed(2);
  const delta = (a, b) => b ? `${a >= b ? '+' : '−'}${Math.abs(Math.round((a - b) / b * 100))} % zum Vormonat` : 'Vormonat: –';

  const exp = CATS.expense.map((c, i) => ({ n: c.name, v: t.byCat['expense:' + c.id] || 0, c: SERIES[i] })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  const pas = [['zinsen', 'Zinsen'], ['miete_ein', 'Mieteinnahmen'], ['dividende', 'Dividenden']].map(([id, n]) => ({ n, v: t.byCat['income:' + id] || 0, c: catColor('income', id) }));
  const pMax = Math.max(...pas.map(p => p.v), 1);
  const yearPassive = sums(S.entries.filter(e => e.date.startsWith(U.ym.slice(0, 4)))).passive;
  const months = Array.from({ length: 6 }, (_, i) => addM(U.ym, i - 5));

  return `${banner()}
  <section class="card hero" aria-label="Monatssaldo">
    <h2>Frei verfügbar · ${esc(mLong(U.ym))}</h2>
    <div class="big ${t.free < 0 ? '' : ''}">${fmt(t.free)}</div>
    <div class="meta">Einnahmen minus Ausgaben minus Ersparnisse · Sparquote ${Math.round(quote * 100)} %</div>
    <div class="flow" role="img" aria-label="Aufteilung der Einnahmen">
      <i style="width:${pct(t.expense)}%;background:var(--exp)"></i>
      <i style="width:${pct(t.saving)}%;background:var(--sav)"></i>
      <i style="width:${pct(t.free)}%;background:var(--inc)"></i>
    </div>
    <div class="legend"><span><i class="dot" style="background:var(--exp)"></i>Ausgaben</span><span><i class="dot" style="background:var(--sav)"></i>Gespart</span><span><i class="dot" style="background:var(--inc)"></i>Übrig</span></div>
  </section>
  <div class="tiles">
    ${['income', 'expense', 'saving'].map(k => `<button class="tile" data-act="filter" data-f="${k}"><span class="lbl"><i class="dot" style="background:${TYPE[k].color}"></i>${TYPE[k].name}</span><span class="val">${fmt(t[k])}</span><span class="delta">${delta(t[k], prev[k])}</span></button>`).join('')}
  </div>
  <section class="card">
    <div class="row"><h2>Passives Einkommen</h2><span class="sub">${t.income ? Math.round(t.passive / t.income * 100) : 0} % der Einnahmen</span></div>
    <div class="hbar">${pas.map(p => `<div class="hb"><div class="row"><span><i class="dot" style="background:${p.c}"></i> ${p.n}</span><b>${fmt(p.v)}</b></div><div class="track"><i style="width:${(p.v / pMax * 100).toFixed(1)}%;background:${p.c}"></i></div></div>`).join('')}</div>
    <p class="sub">Summe Monat <b style="color:var(--fg)">${fmt(t.passive)}</b> · Jahr ${U.ym.slice(0, 4)} bisher <b style="color:var(--fg)">${fmt(yearPassive)}</b></p>
  </section>
  <section class="card">
    <h2>Ausgaben nach Kategorie</h2>
    ${exp.length ? `<div class="donutwrap">${donut(exp, t.expense, 'Ausgaben')}<div class="catlist">${exp.slice(0, 6).map(x => `<div class="ci"><i class="dot" style="background:${x.c}"></i><span><span>${esc(x.n)}</span><small>${Math.round(x.v / t.expense * 100)} %</small></span><b>${fmt(x.v)}</b></div>`).join('')}${exp.length > 6 ? `<div class="ci"><i></i><span class="sub">+ ${exp.length - 6} weitere</span><span></span></div>` : ''}</div></div>` : `<div class="empty"><b>Noch keine Ausgaben</b>Tippe auf + um die erste Ausgabe für ${esc(mLong(U.ym))} zu erfassen.</div>`}
  </section>
  <section class="card">
    <div class="row"><h2>Letzte 6 Monate</h2></div>
    <div class="legend"><span><i class="dot" style="background:var(--inc)"></i>Einnahmen</span><span><i class="dot" style="background:var(--exp)"></i>Ausgaben</span><span><i class="dot" style="background:var(--sav)"></i>Ersparnisse</span></div>
    ${monthBars(months)}
    <div class="info" id="barinfo">Tippe auf einen Monat, um ihn auszuwählen.</div>
  </section>`;
}

function itemHTML(e) {
  const c = catOf(e.type, e.cat);
  const sign = e.type === 'income' ? '+' : e.type === 'expense' ? '−' : '→';
  return `<button class="item" data-id="${e.id}">
    <span class="ico" style="background:${catColor(e.type, e.cat)}">${esc(c.s)}</span>
    <span style="min-width:0"><span class="t">${esc(c.name)}${e.rule ? '<span class="tag">monatlich</span>' : ''}${e.type === 'saving' ? '<span class="tag">Sparen</span>' : ''}</span><span class="n">${esc(e.note || TYPE[e.type].one)}</span></span>
    <span class="m ${e.type === 'income' ? 'pos' : ''}">${sign} ${fmt(e.amount)}</span></button>`;
}

function viewList() {
  let list = inMonth(U.ym);
  if (U.filter === 'passive') list = list.filter(e => e.type === 'income' && PASSIVE.includes(e.cat));
  else if (U.filter !== 'all') list = list.filter(e => e.type === U.filter);
  list.sort((a, b) => b.date.localeCompare(a.date) || (b.id > a.id ? 1 : -1));
  const f = [['all', 'Alle'], ['income', 'Einnahmen'], ['passive', 'Zinsen · Mieten · Dividenden'], ['expense', 'Ausgaben'], ['saving', 'Ersparnisse']];
  const t = sums(list);
  const groups = {}; list.forEach(e => (groups[e.date] = groups[e.date] || []).push(e));
  return `${banner()}<div class="chips" role="group" aria-label="Filter">${f.map(([k, n]) => `<button class="chip" data-act="filter" data-f="${k}" aria-pressed="${U.filter === k}">${n}</button>`).join('')}</div>
  <div class="tiles">
    <div class="tile"><span class="lbl"><i class="dot" style="background:var(--inc)"></i>Ein</span><span class="val">${fmt(t.income)}</span></div>
    <div class="tile"><span class="lbl"><i class="dot" style="background:var(--exp)"></i>Aus</span><span class="val">${fmt(t.expense)}</span></div>
    <div class="tile"><span class="lbl"><i class="dot" style="background:var(--sav)"></i>Gespart</span><span class="val">${fmt(t.saving)}</span></div>
  </div>
  ${list.length ? Object.keys(groups).map(d => `<div class="day">${esc(dayLabel(d))}</div><div class="list">${groups[d].map(itemHTML).join('')}</div>`).join('') :
    `<div class="card empty"><b>Keine Buchungen</b>Für ${esc(mLong(U.ym))} gibt es hier noch nichts. Tippe auf +, um eine Buchung anzulegen.</div>`}`;
}

function viewYear() {
  const y = String(U.year);
  const rows = Array.from({ length: 12 }, (_, i) => { const ym = `${y}-${pad(i + 1)}`; return { ym, ...sums(inMonth(ym)) }; });
  const tot = sums(S.entries.filter(e => e.date.startsWith(y)));
  const has = r => r.income || r.expense || r.saving;
  const cell = (v, cls = '') => `<td class="${cls}">${v ? fmt(v) : '<span style="color:var(--faint)">–</span>'}</td>`;
  const yearCats = CATS.expense.map((c, i) => ({ n: c.name, v: tot.byCat['expense:' + c.id] || 0, c: SERIES[i] })).filter(x => x.v).sort((a, b) => b.v - a.v);
  return `${banner()}
  <div class="tiles">
    <div class="tile"><span class="lbl"><i class="dot" style="background:var(--inc)"></i>Einnahmen</span><span class="val">${eur0.format(tot.income)}</span><span class="delta">davon passiv ${fmt(tot.passive)}</span></div>
    <div class="tile"><span class="lbl"><i class="dot" style="background:var(--exp)"></i>Ausgaben</span><span class="val">${eur0.format(tot.expense)}</span><span class="delta">Ø ${eur0.format(tot.expense / Math.max(1, rows.filter(has).length))}/Monat</span></div>
    <div class="tile"><span class="lbl"><i class="dot" style="background:var(--sav)"></i>Ersparnisse</span><span class="val">${eur0.format(tot.saving)}</span><span class="delta">Sparquote ${tot.income ? Math.round(tot.saving / tot.income * 100) : 0} %</span></div>
  </div>
  <section class="card">
    <h2>Monatsübersicht ${y}</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>Monat</th><th><i class="dot" style="background:var(--inc)"></i>Einnahmen</th><th>davon passiv</th><th><i class="dot" style="background:var(--exp)"></i>Ausgaben</th><th><i class="dot" style="background:var(--sav)"></i>Ersparnisse</th><th>Saldo</th></tr></thead>
      <tbody>${rows.map(r => `<tr data-ym="${r.ym}" style="cursor:pointer"><td>${new Date(r.ym + '-15').toLocaleDateString('de-DE', { month: 'long' })}</td>${cell(r.income)}${cell(r.passive)}${cell(r.expense)}${cell(r.saving)}${has(r) ? `<td class="${r.free < 0 ? 'neg' : ''}">${fmt(r.free)}</td>` : cell(0)}</tr>`).join('')}</tbody>
      <tfoot><tr><td>Summe</td>${cell(tot.income)}${cell(tot.passive)}${cell(tot.expense)}${cell(tot.saving)}<td class="${tot.free < 0 ? 'neg' : ''}">${fmt(tot.free)}</td></tr></tfoot>
    </table></div>
    <p class="sub">Saldo = Einnahmen − Ausgaben − Ersparnisse. Tippe auf einen Monat für die Details.</p>
  </section>
  ${yearCats.length ? `<section class="card"><h2>Ausgaben ${y} nach Kategorie</h2><div class="donutwrap">${donut(yearCats, tot.expense, 'Ausgaben')}<div class="catlist">${yearCats.slice(0, 6).map(x => `<div class="ci"><i class="dot" style="background:${x.c}"></i><span><span>${esc(x.n)}</span><small>${Math.round(x.v / tot.expense * 100)} %</small></span><b>${fmtK(x.v)}</b></div>`).join('')}</div></div></section>` : ''}`;
}

function viewSave() {
  const bal = savingsUntil(ymNow() > U.ym ? U.ym : ymNow());
  const goal = S.settings.goal || 0;
  const months = Array.from({ length: 12 }, (_, i) => addM(U.ym, i - 11));
  const all = S.entries.filter(e => e.type === 'saving' && e.date.slice(0, 7) <= U.ym);
  const by = CATS.saving.map(c => ({ n: c.name, v: all.filter(e => e.cat === c.id).reduce((a, e) => a + e.amount, 0) })).filter(x => x.v);
  const bMax = Math.max(...by.map(b => b.v), 1);
  const last3 = [1, 2, 3].map(i => sums(inMonth(addM(U.ym, -i))).saving + 0);
  const avg = (last3.reduce((a, b) => a + b, 0) / 3) || sums(inMonth(U.ym)).saving;
  const rest = goal - bal;
  const eta = rest > 0 && avg > 0 ? Math.ceil(rest / avg) : null;
  const list = inMonth(U.ym).filter(e => e.type === 'saving').sort((a, b) => b.date.localeCompare(a.date));
  return `${banner()}
  <section class="card">
    <h2>Sparguthaben Ende ${esc(mLong(U.ym))}</h2>
    <div class="goal">${goal ? ring(bal / goal) : ''}<div style="display:flex;flex-direction:column;gap:4px;min-width:0">
      <div style="font:700 30px/1.1 var(--font-d);letter-spacing:-.02em">${fmt(bal)}</div>
      ${goal ? `<span class="sub">Sparziel ${fmt(goal)}</span><span class="sub">${rest <= 0 ? 'Ziel erreicht.' : eta ? `Noch ${fmt(rest)} · bei Ø ${fmt(avg)} im Monat in etwa ${eta} Monaten` : `Noch ${fmt(rest)}`}</span>` : '<span class="sub">Lege unter „Mehr“ ein Sparziel fest.</span>'}
    </div></div>
  </section>
  <section class="card"><h2>Entwicklung · 12 Monate</h2>${savingsLine(months)}<p class="sub">Inklusive Startguthaben von ${fmt(S.settings.startSavings)}.</p></section>
  ${by.length ? `<section class="card"><h2>Wohin das Ersparte geht</h2><div class="hbar">${by.map(b => `<div class="hb"><div class="row"><span>${esc(b.n)}</span><b>${fmt(b.v)}</b></div><div class="track"><i style="width:${(b.v / bMax * 100).toFixed(1)}%;background:var(--sav)"></i></div></div>`).join('')}</div></section>` : ''}
  <div class="day">Sparbuchungen ${esc(mLong(U.ym))}</div>
  ${list.length ? `<div class="list">${list.map(itemHTML).join('')}</div>` : `<div class="card empty"><b>Noch nichts gespart</b>Tippe auf + und wähle „Sparen“.</div>`}`;
}

function viewMore() {
  return `<section class="card">
    <h2>Ersparnisse</h2>
    <div class="two">
      <div class="field"><label for="goal">Sparziel (€)</label><input class="input" id="goal" inputmode="decimal" value="${String(S.settings.goal).replace('.', ',')}"></div>
      <div class="field"><label for="start">Startguthaben (€)</label><input class="input" id="start" inputmode="decimal" value="${String(S.settings.startSavings).replace('.', ',')}"></div>
    </div>
    <button class="btn primary" data-act="savesettings">Übernehmen</button>
  </section>
  <section class="card">
    <h2>Monatliche Buchungen</h2>
    ${S.rules.length ? `<div class="list" style="background:var(--bg)">${S.rules.map(r => { const c = catOf(r.type, r.cat); return `<div class="item" style="grid-template-columns:38px minmax(0,1fr) auto"><span class="ico" style="background:${catColor(r.type, r.cat)}">${esc(c.s)}</span><span style="min-width:0"><span class="t">${esc(c.name)}</span><span class="n">${fmt(r.amount)} am ${r.day}. · ${esc(r.note || TYPE[r.type].one)}</span></span><button class="chip" data-act="delrule" data-id="${r.id}" style="color:var(--neg)">Beenden</button></div>`; }).join('')}</div>` : '<p class="sub">Keine. Aktiviere beim Erfassen „Jeden Monat wiederholen“, z. B. für Gehalt, Miete oder Sparplan.</p>'}
  </section>
  <section class="card">
    <h2>Daten</h2>
    <p class="sub">Deine Daten bleiben nur auf diesem Gerät. Sichere sie ab und zu als Datei.</p>
    <div class="btnrow">
      <button class="btn" data-act="export">Backup sichern</button>
      <button class="btn" data-act="import">Backup laden</button>
      <button class="btn" data-act="csv">Als CSV (Excel)</button>
    </div>
    <div id="confirmbox"></div>
    <button class="btn danger" data-act="askwipe">Alle Daten löschen</button>
    ${!S.demo ? '<button class="btn" data-act="loaddemo">Beispieldaten anzeigen</button>' : ''}
  </section>
  <section class="card">
    <h2>Als App auf dem iPhone</h2>
    <p class="sub">In Safari auf <b>Teilen</b> tippen, dann <b>Zum Home-Bildschirm</b>. Kassenbuch startet danach im Vollbild und funktioniert auch offline.</p>
  </section>`;
}

const TITLES = { home: 'Übersicht', list: 'Buchungen', year: 'Jahr', save: 'Sparen', more: 'Mehr' };
function render() {
  materialize(); persist();
  $('title').textContent = TITLES[U.tab];
  document.querySelectorAll('#tabs button').forEach(b => { if (b.dataset.tab === U.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  $('monthnav').hidden = U.tab === 'more';
  $('period').textContent = U.tab === 'year' ? String(U.year) : mLong(U.ym);
  $('next').disabled = false;
  main.innerHTML = ({ home: viewHome, list: viewList, year: viewYear, save: viewSave, more: viewMore })[U.tab]();
}

/* ---------- events ---------- */
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  U.tab = b.dataset.tab; try { localStorage.setItem(KEY + '.tab', U.tab); } catch (err) {}
  render(); window.scrollTo(0, 0);
});
$('prev').onclick = () => { if (U.tab === 'year') U.year--; else U.ym = addM(U.ym, -1); render(); };
$('next').onclick = () => { if (U.tab === 'year') U.year++; else U.ym = addM(U.ym, 1); render(); };

main.addEventListener('click', e => {
  const it = e.target.closest('.item[data-id]'); if (it) return openSheet(S.entries.find(x => x.id === it.dataset.id));
  const tr = e.target.closest('tr[data-ym]'); if (tr) { U.ym = tr.dataset.ym; U.tab = 'list'; U.filter = 'all'; render(); window.scrollTo(0, 0); return; }
  const bar = e.target.closest('rect[data-ym]');
  if (bar) {
    const ym = bar.dataset.ym, t = sums(inMonth(ym));
    if (ym === U.ym) { $('barinfo').innerHTML = `<b>${esc(mLong(ym))}</b>: Ein ${fmt(t.income)} · Aus ${fmt(t.expense)} · Gespart ${fmt(t.saving)}`; return; }
    U.ym = ym; render();
    $('barinfo').innerHTML = `<b>${esc(mLong(ym))}</b>: Ein ${fmt(t.income)} · Aus ${fmt(t.expense)} · Gespart ${fmt(t.saving)}`;
    return;
  }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'filter') { U.filter = a.dataset.f; U.tab = 'list'; render(); }
  if (act === 'cleardemo') { S.entries = []; S.rules = []; S.demo = false; S.settings.startSavings = 0; render(); toast('Bereit. Erfasse deine erste Buchung mit +'); }
  if (act === 'loaddemo') { const d = demoData(); S = Object.assign(d, { settings: Object.assign(d.settings, { goal: S.settings.goal }) }); render(); }
  if (act === 'savesettings') {
    const g = parseAmt($('goal').value), s = parseAmt($('start').value);
    if (isNaN(g) || isNaN(s)) return toast('Bitte gültige Beträge eingeben');
    S.settings.goal = g; S.settings.startSavings = s; persist(); toast('Gespeichert');
  }
  if (act === 'delrule') { S.rules = S.rules.filter(r => r.id !== a.dataset.id); persist(); render(); toast('Wiederholung beendet'); }
  if (act === 'askwipe') {
    $('confirmbox').innerHTML = `<div class="confirm"><b>Wirklich alle Buchungen löschen?</b><span class="sub">Das lässt sich nicht rückgängig machen. Sichere vorher ein Backup.</span><div class="btnrow"><button class="btn" data-act="nowipe">Behalten</button><button class="btn primary" data-act="wipe">Löschen</button></div></div>`;
  }
  if (act === 'nowipe') $('confirmbox').innerHTML = '';
  if (act === 'wipe') { S = { entries: [], rules: [], settings: S.settings, demo: false }; render(); toast('Alle Daten gelöscht'); }
  if (act === 'export') saveFile(`kassenbuch-backup-${today()}.json`, JSON.stringify(S, null, 1), 'application/json');
  if (act === 'csv') {
    const rows = [['Datum', 'Art', 'Kategorie', 'Betrag', 'Notiz']].concat(
      [...S.entries].sort((a, b) => a.date.localeCompare(b.date)).map(e => [e.date, TYPE[e.type].one, catOf(e.type, e.cat).name, (e.type === 'expense' ? -e.amount : e.amount).toFixed(2).replace('.', ','), e.note || '']));
    saveFile(`kassenbuch-${today()}.csv`, '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\n'), 'text/csv');
  }
  if (act === 'import') $('importfile').click();
});

$('importfile').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.entries)) throw new Error();
    S = d; S.rules = S.rules || []; S.settings = Object.assign({ goal: 15000, startSavings: 0 }, S.settings || {});
    render(); toast(`${S.entries.length} Buchungen geladen`);
  } catch (e) { toast('Die Datei ist kein Kassenbuch-Backup'); }
  ev.target.value = '';
});

async function saveFile(name, text, type) {
  const file = new File([text], name, { type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

let tt; function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); }
const parseAmt = s => { s = String(s).trim().replace(/\s|€/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); return s === '' ? NaN : Number(s); };

/* ---------- sheet ---------- */
const form = $('form');
function fillCats(type, sel) {
  $('cats').innerHTML = CATS[type].map((c, i) => `<input type="radio" name="cat" id="cat-${c.id}" value="${c.id}" ${(sel ? sel === c.id : i === 0) ? 'checked' : ''}><label for="cat-${c.id}">${esc(c.name)}</label>`).join('');
}
form.addEventListener('change', e => { if (e.target.name === 'type') fillCats(e.target.value); });
const sizeAmt = () => { const n = $('amount').value.length; $('amount').style.fontSize = n > 11 ? '24px' : n > 8 ? '30px' : ''; };
$('amount').addEventListener('input', sizeAmt);
function openSheet(entry) {
  U.sel = entry || null;
  const type = entry ? entry.type : (U.tab === 'save' ? 'saving' : U.filter === 'income' || U.filter === 'passive' ? 'income' : 'expense');
  form.querySelector(`input[name=type][value=${type}]`).checked = true;
  fillCats(type, entry && entry.cat);
  $('amount').value = entry ? String(entry.amount.toFixed(2)).replace('.', ',') : '';
  sizeAmt();
  const defDate = U.ym === ymNow() ? today() : `${U.ym}-01`;
  $('date').value = entry ? entry.date : defDate;
  $('note').value = entry ? entry.note || '' : '';
  $('recurring').checked = !!(entry && entry.rule && S.rules.some(r => r.id === entry.rule));
  $('recurring').disabled = !!(entry && entry.rule);
  $('sheettitle').textContent = entry ? 'Buchung bearbeiten' : 'Neue Buchung';
  $('del').hidden = !entry; $('formerr').hidden = true;
  $('scrim').hidden = false; $('sheet').hidden = false;
  requestAnimationFrame(() => { $('scrim').classList.add('on'); $('sheet').classList.add('on'); });
  if (!entry) setTimeout(() => $('amount').focus(), 280);
}
function closeSheet() {
  $('scrim').classList.remove('on'); $('sheet').classList.remove('on');
  setTimeout(() => { $('scrim').hidden = true; $('sheet').hidden = true; }, 260);
}
$('fab').onclick = () => openSheet();
$('cancel').onclick = closeSheet; $('scrim').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });
form.addEventListener('submit', e => {
  e.preventDefault();
  const amount = Math.round(parseAmt($('amount').value) * 100) / 100;
  const err = m => { $('formerr').textContent = m; $('formerr').hidden = false; };
  if (!(amount > 0)) return err('Bitte einen Betrag größer als 0 eingeben, z. B. 12,50.');
  if (!$('date').value) return err('Bitte ein Datum wählen.');
  const data = { type: form.type.value, cat: form.cat.value, amount, date: $('date').value, note: $('note').value.trim() };
  if (U.sel) {
    Object.assign(U.sel, data);
    if (U.sel.rule) { const r = S.rules.find(r => r.id === U.sel.rule); if (r) Object.assign(r, { type: data.type, cat: data.cat, amount, note: data.note }); }
  } else {
    if (S.demo) { S.entries = []; S.rules = []; S.settings.startSavings = 0; S.demo = false; setTimeout(() => toast('Beispieldaten entfernt, deine Buchung ist gespeichert'), 2300); }
    const entry = Object.assign({ id: uid() }, data);
    if ($('recurring').checked) {
      const r = { id: uid(), type: data.type, cat: data.cat, amount, note: data.note, day: +data.date.slice(8), next: addM(data.date.slice(0, 7), 1) };
      S.rules.push(r); entry.rule = r.id;
    }
    S.entries.push(entry);
  }
  closeSheet(); U.ym = data.date.slice(0, 7); render();
  toast(U.sel ? 'Änderung gespeichert' : `${TYPE[data.type].one} gespeichert`);
});
$('del').onclick = () => {
  if (!U.sel) return;
  if ($('del').dataset.armed !== '1') { $('del').dataset.armed = '1'; $('del').textContent = 'Zum Löschen nochmal tippen'; setTimeout(() => { $('del').dataset.armed = ''; $('del').textContent = 'Buchung löschen'; }, 3000); return; }
  $('del').dataset.armed = ''; $('del').textContent = 'Buchung löschen';
  S.entries = S.entries.filter(x => x !== U.sel); closeSheet(); render(); toast('Gelöscht');
};

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
})();
</script>
</body>
</html>
